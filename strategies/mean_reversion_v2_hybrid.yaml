# Mean-Reversion V2 — Best of Both / Hybrid (5m markets)
#
# 11 patterns cherry-picked from maker and volume zones.
# Best risk-adjusted: lowest MaxDD ($46), strong $/trade ($0.264).
# 21-day backtest: $19.85/day, 1783 trades.

coins: ["BTC", "ETH", "SOL", "XRP"]

size: 5.0
entry_window_start: 1
entry_window_end: 3
cancel_timeout: 10.0
max_trades_per_cycle: 4

drawdown_protection:
  enabled: true
  max_drawdown: 50.0
  max_consecutive_losses: 8
  cooldown_minutes: 15

trade_log: meanrev_v2_hybrid.txt

rules:
  - pattern: "UUDUUD"
    side: "UP"
    coins: ["BTC"]
    max_ask: 0.48

  - pattern: "DUDDUD"
    side: "UP"
    coins: ["BTC", "ETH", "SOL", "XRP"]
    max_ask: 0.48

  - pattern: "DDUDDD"
    side: "UP"
    coins: ["BTC", "ETH", "SOL", "XRP"]
    max_ask: 0.48

  - pattern: "UDDUUD"
    side: "UP"
    coins: ["SOL"]
    max_ask: 0.48

  - pattern: "DDUUD"
    side: "UP"
    coins: ["BTC", "ETH", "SOL", "XRP"]
    max_ask: 0.50

  - pattern: "DUUD"
    side: "UP"
    coins: ["BTC"]
    max_ask: 0.50

  - pattern: "UDUU"
    side: "DOWN"
    coins: ["BTC"]
    max_ask: 0.50

  - pattern: "UUUD"
    side: "DOWN"
    coins: ["XRP"]
    max_ask: 0.52

  - pattern: "UUU"
    side: "DOWN"
    coins: ["ETH"]
    max_ask: 0.46

  - pattern: "UUUU"
    side: "DOWN"
    coins: ["ETH"]
    max_ask: 0.46

  - pattern: "DDD"
    side: "UP"
    coins: ["BTC"]
    max_ask: 0.55
