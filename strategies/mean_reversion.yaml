# Mean-Reversion Strategy Config
# Based on Telonex 74-day backtest (60,605 markets)
# Only Bonferroni-significant patterns (alpha = 0.000039)
#
# Rules are ordered by PRIORITY (highest first = longest pattern).
# For each coin in each cycle, the FIRST matching rule wins.
# Each rule has its own max_ask = the GTC limit price we place.
#
# IMPORTANT: keep rules sorted longest-pattern-first per coin!
# If UUUU matches, we want that rule (higher WR, higher max_ask),
# not UUU (lower WR, lower max_ask).
#
# Entry mechanism: GTC limit order at max_ask price, cancel after cancel_timeout.
# If filled at better price, great. May fill as maker (0% fee) instead of taker (1.5%).

entry_window_start: 1     # seconds after cycle start (place limit immediately)
entry_window_end: 3       # seconds — orders placed once, ASAP
cancel_timeout: 10.0      # seconds after placing GTC to cancel unfilled orders
size: 5.0                 # shares per trade (flat, no Kelly)

rules:
  # --- ETH: strongest edge ---
  # ETH UUUU->DOWN: WR=57.4%, N=751, break-even=$0.535
  - pattern: "UUUU"
    side: "DOWN"
    coins: ["ETH"]
    max_ask: 0.52

  # ETH UUU->DOWN: WR=55.8%, N=1698, break-even=$0.519
  - pattern: "UUU"
    side: "DOWN"
    coins: ["ETH"]
    max_ask: 0.50

  # --- ALL coins (non-ETH): decent edge ---
  # ALL UUUU->DOWN: WR=54.5%, N=3252, break-even=$0.507
  - pattern: "UUUU"
    side: "DOWN"
    coins: ["BTC", "SOL", "XRP"]
    max_ask: 0.50

  # ALL UUU->DOWN: WR=54.0%, N=7069, break-even=$0.502
  # SOL specific: WR=53.9%, break-even=$0.501
  # BTC specific: WR=53.3%, break-even=$0.495
  - pattern: "UUU"
    side: "DOWN"
    coins: ["SOL"]
    max_ask: 0.49

  - pattern: "UUU"
    side: "DOWN"
    coins: ["BTC"]
    max_ask: 0.48

  # XRP: weakest, only at very tight max_ask
  # XRP UUU: not individually significant, skip
  # XRP UUUU: included in ALL above
