# Mean-Reversion Strategy Config (LIVE)
#
# Bidirectional: bets DOWN after UP streaks, UP after DOWN streaks.
# All patterns Bonferroni-significant on Telonex 74-day dataset.
# No indicator filters (RSI proven useless after look-ahead bias fix).
#
# Execution model:
# - Place GTC limit at max_ask around t=1s
# - Cancel all unfilled after 10s
# - Hold filled size to resolution

entry_window_start: 1
entry_window_end: 3
cancel_timeout: 10.0
size: 5.0

# RSI filter — disabled (look-ahead bias proved it doesn't help WR)
rsi_filter:
  enabled: false
  period: 7
  timeframe: "5m"
  threshold: 60

# Drawdown protection
drawdown_protection:
  enabled: true
  max_drawdown: 30.0
  max_consecutive_losses: 8
  cooldown_minutes: 30

rules:
  # ---------------------------------------------------------------
  # DOWN-streak reversals (bet UP) — NEW
  # ---------------------------------------------------------------

  # DUDUDD->UP ALL (57.7% WR, N=958, bonf_p=0.0012, 10/10 weeks green)
  - pattern: "DUDUDD"
    side: "UP"
    coins: ["BTC", "ETH", "SOL", "XRP"]
    max_ask: 0.51

  # DDDDD->UP ETH (60.3% WR, N=292, p=0.000266)
  - pattern: "DDDDD"
    side: "UP"
    coins: ["ETH"]
    max_ask: 0.51

  # DDDD->UP ETH (58.3% WR, N=701, bonf_p=0.0070, 8/9 weeks green)
  - pattern: "DDDD"
    side: "UP"
    coins: ["ETH"]
    max_ask: 0.51

  # DDD->UP ETH (55.6% WR, N=1580, bonf_p=0.0051)
  - pattern: "DDD"
    side: "UP"
    coins: ["ETH"]
    max_ask: 0.51

  # ---------------------------------------------------------------
  # UP-streak reversals (bet DOWN) — existing patterns
  # ---------------------------------------------------------------

  # UUUU->DOWN ETH (57.4% WR, N=751, bonf_p=0.036)
  - pattern: "UUUU"
    side: "DOWN"
    coins: ["ETH"]
    max_ask: 0.51

  # UUUU->DOWN others (54.5% WR, N=2501)
  - pattern: "UUUU"
    side: "DOWN"
    coins: ["BTC", "SOL", "XRP"]
    max_ask: 0.51

  # UUU->DOWN ETH (55.8% WR, N=1698, bonf_p=0.0013, 9/9 weeks green)
  - pattern: "UUU"
    side: "DOWN"
    coins: ["ETH"]
    max_ask: 0.51

  # UUU->DOWN others (54.0% WR, N=5373, bonf_p=0.0000, 10/10 weeks green)
  - pattern: "UUU"
    side: "DOWN"
    coins: ["BTC", "SOL", "XRP"]
    max_ask: 0.51
