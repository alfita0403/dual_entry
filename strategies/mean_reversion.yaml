# Mean-Reversion Strategy Config (LIVE)
#
# Source: full_pattern_scan + top30_oos_suite + regime robustness.
# This set keeps robust DOWN patterns with the best OOS consistency.
#
# Execution model:
# - Place GTC limit at max_ask around t=1s
# - Cancel all unfilled after 10s
# - Hold filled size to resolution

entry_window_start: 1
entry_window_end: 3
cancel_timeout: 10.0
size: 5.0

rules:
  # ---------------------------------------------------------------
  # Length 5 (highest priority by length)
  # ---------------------------------------------------------------
  # ETH UUUUU->DOWN behaves strongly; allow wider cap for ETH
  - pattern: "UUUUU"
    side: "DOWN"
    coins: ["ETH"]
    max_ask: 0.53

  # ALL UUUUU->DOWN robust OOS; conservative cap for non-ETH
  - pattern: "UUUUU"
    side: "DOWN"
    coins: ["BTC", "SOL", "XRP"]
    max_ask: 0.50

  # ---------------------------------------------------------------
  # Length 4
  # ---------------------------------------------------------------
  # Strongest single-coin edge
  - pattern: "UUUU"
    side: "DOWN"
    coins: ["ETH"]
    max_ask: 0.53

  # Broad robust edge for other coins
  - pattern: "UUUU"
    side: "DOWN"
    coins: ["BTC", "SOL", "XRP"]
    max_ask: 0.50

  # BTC-specific robust family found in top30 suite
  - pattern: "UDUU"
    side: "DOWN"
    coins: ["BTC"]
    max_ask: 0.50

  # ---------------------------------------------------------------
  # Length 3 fallback (high frequency)
  # ---------------------------------------------------------------
  - pattern: "UUU"
    side: "DOWN"
    coins: ["BTC", "ETH", "SOL", "XRP"]
    max_ask: 0.50
