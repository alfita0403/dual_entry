# Mean-Reversion Strategy Config (LIVE)
#
# Bidirectional: bets DOWN after UP streaks, UP after DOWN streaks.
# All patterns Bonferroni-significant on Telonex 74-day dataset.
# max_ask values raised from 0.51 to 0.55 based on CSV backtest with
# real prices — at 0.51 all patterns lose due to insufficient fills.
# No indicator filters (RSI proven useless after look-ahead bias fix).
#
# Execution model:
# - Place GTC limit at max_ask around t=1s
# - Cancel all unfilled after 10s
# - Hold filled size to resolution

entry_window_start: 1
entry_window_end: 3
cancel_timeout: 10.0
size: 5.0

# RSI filter — disabled (look-ahead bias proved it doesn't help WR)
rsi_filter:
  enabled: false
  period: 7
  timeframe: "5m"
  threshold: 60

# Drawdown protection
drawdown_protection:
  enabled: true
  max_drawdown: 30.0
  max_consecutive_losses: 8
  cooldown_minutes: 30

rules:
  # ---------------------------------------------------------------
  # DOWN-streak reversals (bet UP)
  # ---------------------------------------------------------------

  # DDDDD->UP ETH (60.3% WR Telonex, 62.5% WR CSV@0.55, N=292)
  - pattern: "DDDDD"
    side: "UP"
    coins: ["ETH"]
    max_ask: 0.55

  # DDDD->UP ETH (58.3% WR Telonex, 54.5% WR CSV@0.55, N=701)
  - pattern: "DDDD"
    side: "UP"
    coins: ["ETH"]
    max_ask: 0.55

  # DDD->UP ETH (55.6% WR Telonex, 54.8% WR CSV@0.57, N=1580)
  - pattern: "DDD"
    side: "UP"
    coins: ["ETH"]
    max_ask: 0.55

  # ---------------------------------------------------------------
  # UP-streak reversals (bet DOWN)
  # ---------------------------------------------------------------

  # UUUU->DOWN ETH (57.4% WR Telonex, 58.8% WR CSV@0.54, N=751)
  - pattern: "UUUU"
    side: "DOWN"
    coins: ["ETH"]
    max_ask: 0.55

  # UUUU->DOWN others (54.5% WR Telonex, CSV too few trades)
  - pattern: "UUUU"
    side: "DOWN"
    coins: ["BTC", "SOL", "XRP"]
    max_ask: 0.55

  # UUU->DOWN ETH (55.8% WR Telonex, 54.9% WR CSV@0.57, N=1698)
  - pattern: "UUU"
    side: "DOWN"
    coins: ["ETH"]
    max_ask: 0.55

  # UUU->DOWN others (54.0% WR Telonex, CSV marginal)
  - pattern: "UUU"
    side: "DOWN"
    coins: ["BTC", "SOL", "XRP"]
    max_ask: 0.55
